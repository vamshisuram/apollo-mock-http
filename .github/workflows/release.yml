# Release: publish to npm via semantic-release, on push to main only.
#
# SECURITY: There is no long-lived npm credential anywhere in this repository.
# Publishing uses npm trusted publishing: the job requests a short-lived OIDC
# token from GitHub describing itself (repo, workflow, ref), and npm exchanges
# it for a credential valid for minutes. npm verifies the request came from this
# repository and this workflow file, which a stolen string cannot forge.
#
# This closes the poisoned-pipeline-execution hole from the old CircleCI config,
# where the PR build job ran untrusted code with NPM_TOKEN in its environment.
# There is now no token to steal, and this workflow triggers only on `push` to
# `main` — post-merge, reviewed code. PR code never runs here.
#
# NOTE: the workflow FILENAME is part of the trusted publisher identity
# registered on npm. Renaming this file breaks publishing until the npm-side
# configuration is updated to match.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write       # create the git tag + GitHub release
  id-token: write       # mint the OIDC token npm exchanges for publish rights

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # semantic-release needs full history + tags
          # Nothing in the release pipeline pushes to git any more — the tag and
          # release notes are created through the GitHub API. So this workflow
          # needs no authenticated git remote either.
          persist-credentials: false

      # No registry-url. Setting it makes setup-node write an .npmrc containing
      # `_authToken=${NODE_AUTH_TOKEN}` and point NPM_CONFIG_USERCONFIG at it.
      # Yarn expands that variable during install and fails hard when it is
      # unset — and it is unset by design, because publishing uses OIDC rather
      # than a token. semantic-release defaults to the official registry.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Semantic Release
        run: npx semantic-release
        env:
          # No NPM_TOKEN. @semantic-release/npm establishes an OIDC context
          # first and only falls back to a token if that fails, so publishing
          # here relies entirely on the trusted publisher configured on npm.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
